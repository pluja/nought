# Dovecot for nought's local test environment. Test-only: one static
# password for every user; listens only inside the container, published on
# 127.0.0.1 by compose.yaml.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

protocols = imap
log_path = /dev/stdout
auth_verbose = yes

default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
mail_uid = vmail
mail_gid = vmail

mail_driver = maildir
mail_home = /srv/vmail/%{user | lower}
mail_path = ~/mail
mailbox_list_utf8 = yes

# "." as hierarchy separator, as on many Courier/Dovecot setups, so nought's
# delimiter handling is exercised ("Archive.2024" is shown as "Archive/2024").
namespace inbox {
  inbox = yes
  separator = .
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}

passdb static {
  password = nought-test-password
}

ssl = required
ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}

service imap-login {
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
  }
}
