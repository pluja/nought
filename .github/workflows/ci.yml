name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs it first

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Build without cgo
        run: go build -trimpath ./cmd/nou
        env:
          CGO_ENABLED: "0"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet and staticcheck
        run: |
          go vet ./...
          go tool staticcheck ./...
      - name: Example scripts
        run: shellcheck --shell=sh --severity=warning examples/*.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # GOLANGCI_LINT_VERSION in the Makefile
      - name: Coverage floor
        run: make cover
      - name: Vulnerabilities
        run: go tool govulncheck ./...
